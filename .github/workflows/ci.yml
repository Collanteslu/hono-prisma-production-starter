name: CI & Typecheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Read-only token for the workflow; cancel superseded runs of the same branch/PR
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🛠️ Generar Prisma Client
        run: npx prisma generate

      - name: 🛡️ Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: 🗄️ Verificar que las migraciones coinciden con el schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: 🔎 Verificación de tipos (código y tests, incluye el cliente RPC tipado)
        run: npm run typecheck

      - name: 🏗️ Compilación (Build)
        run: npm run build

      - name: ⚡ Linting & Formatting Check (Biome)
        run: npm run lint

      - name: 🐳 Construir la imagen Docker
        run: docker build -t hono-api:ci .

      # Los tests crean y migran su propia base de datos SQLite temporal (ver vitest.config.ts)
      - name: 🧪 Ejecutar Tests Automatizados con cobertura (Vitest)
        run: npm run test:coverage
