name: CI & Typecheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🛠️ Generar Prisma Client
        run: npx prisma generate

      - name: 🗄️ Crear esquema de base de datos para Tests
        run: npx prisma db push

      - name: 🔎 Verificación de tipos TypeScript (Build)
        run: npm run build

      - name: ⚡ Linting & Formatting Check (Biome)
        run: npm run lint

      - name: 🧪 Ejecutar Tests Automatizados (Vitest)
        run: npm test
        env:
          JWT_SECRET: "ci_jwt_secret_test_key_at_least_32_chars_long"
          JWT_REFRESH_SECRET: "ci_jwt_refresh_secret_test_key_at_least_32_chars"
          NODE_ENV: "test"
